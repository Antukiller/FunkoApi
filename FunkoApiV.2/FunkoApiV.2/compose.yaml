services:
  # Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: funkoapi_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: funkos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d funkos"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - funko_net
  mongo_db:
    image: mongo:7
    container_name: funkoapi_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - funko_net
  cassandra:
    image: cassandra:latest
    container_name: funkoapi_cassandra
    restart: always
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=FunkoCluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - funko_net
  # Cache Redis
  redis:
    image: redis:latest
    container_name: funkoapi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - funko_net
  mailpit:
    image: axllent/mailpit:latest
    container_name: funkoapi_mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - funko_net

  # API .NET (FunkoApi V.2)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funkoapi_backend
    restart: always
    ports:
      - "5197:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Postgre=Host=db;Port=5432;Database=funkos;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__Mongo=mongodb://mongo_db:27017
      - Cassandra__Hosts__0=cassandra
      - Cassandra__Port=9042
      - Smtp__Host=smtp.gmail.com
      - Smtp__Port=587
      - Smtp__Username=oms04081974@gmail.com
      - Smtp__Password=ersvficvfajtehbc        
      - Smtp__From=oms04081974@gmail.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mongo_db:
        condition: service_started
      cassandra:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - funko_net

networks:
  funko_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  cassandra_data: