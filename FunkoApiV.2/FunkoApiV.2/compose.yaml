services:
  db:
    image: postgres:16-alpine
    container_name: funkoapi_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: funkos
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d funkos"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - funko_net

  mongo_db:
    image: mongo:7
    container_name: funkoapi_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - funko_net

  cassandra:
    image: cassandra:latest
    container_name: funkoapi_cassandra
    restart: always
    ports:
      - "9043:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: FunkoCluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - funko_net

  redis:
    image: redis:latest
    container_name: funkoapi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - funko_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: funkoapi_mailpit
    profiles: ["development"]
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - funko_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funkoapi_backend
    restart: always
    ports:
      - "5197:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgre: Host=db;Port=5432;Database=funkos;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__Mongo: mongodb://mongo_db:27017
      Cassandra__Hosts__0: cassandra
      Cassandra__Port: 9042
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY en .env}
      Smtp__Host: ${SMTP_HOST:?Define SMTP_HOST en .env}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:?Define SMTP_FROM en .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mongo_db:
        condition: service_started
      cassandra:
        condition: service_started
    networks:
      - funko_net

networks:
  funko_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  cassandra_data:
